<!DOCTYPE html>
<html>
<head><title>Café Saffran — Menu</title></head>
<body>
    <h2>Recherche produit</h2>
    <form method="GET">
        <input name="q" value="{{ q }}" placeholder="ex: Espresso">
        <input type="submit" value="Rechercher">
    </form>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    {% if results %}
    <table border="1">
        <tr><th>Nom</th><th>Prix</th><th>Catégorie</th></tr>
        {% for r in results %}
        <tr><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td></tr>
        {% endfor %}
    </table>
    {% endif %}
</body>
</html>
