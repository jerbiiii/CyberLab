---
- name: Vérifier si Docker est déjà installé
  command: which docker
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Installer les dépendances
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true
  when: docker_check.rc != 0

- name: Créer le dossier des clés APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: docker_check.rc != 0

- name: Ajouter la clé GPG Docker
  shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: true
  when: docker_check.rc != 0

- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true
  when: docker_check.rc != 0

- name: Installer Docker Engine et Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  when: docker_check.rc != 0

- name: Ajouter l'utilisateur courant au groupe docker
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true
