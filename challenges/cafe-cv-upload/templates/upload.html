<!DOCTYPE html>
<html>
<head><title>Café Saffran — Recrutement</title></head>
<body>
    <h2>Envoyer votre CV</h2>
    <form method="POST" enctype="multipart/form-data">

    {% if message %}<p>{{ message }}</p>{% endif %}
</body>
</html>
